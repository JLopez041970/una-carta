<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf3ee">
  <title>Una carta para vos</title>
  <link rel="stylesheet" href="style.css">
  <script src="java.js" defer></script>
  <link rel="icon" type="image/svg+xml" href="imagen/download.svg">
</head>
<body>
  <div class="fondo-vivo" aria-hidden="true" id="fondoVivo"></div>
  <main class="pagina">
    <p class="sobretexto">UN DETALLE HECHO PARA VOS</p>
    <h1>Una carta para mi persona favorita</h1>
    <p class="instruccion" id="instruccion">Tocá el sobre para abrirlo ♡</p>

    <button class="sobre" id="sobre" type="button" aria-label="Abrir la carta" aria-expanded="false">
      <span class="carta" aria-hidden="true"></span>
      <span class="hoja">
        <span class="hoja-contenido">
          <span class="saludo">Para vos, mi amor:</span>
          <!-- Cambiá este texto por tu propia carta -->
          <span class="texto-carta">Mi amor, hice este detallito para nuestro día, no es mucho pero no quiero solo decirte un "Feliz aniversario", quiero llenarte de detalles y regalos por mis manos, más pq salen de mi corazón hacerlos ♡.
Gracias por todo el amor que me brindas amor, por los hermosos momentos que tenemos juntos a distancia, los disfruto y valoro mucho ♡.
Quiero que sepas que sos mi mundo, dónde encuentro esa paz y libertad de poder ser quien soy, te lo agradezco amor, te amo muchísimo y gracias nuevamente ♡.</span>
          <span class="firma">Con todo mi amor,<br><strong>Tu persona ♡</strong></span>
        </span>
      </span>
      <span class="bolsillo"></span>
      <span class="solapa"></span>
      <span class="sello" aria-hidden="true">♥</span>
    </button>
    <button class="boton" id="botonCarta" type="button">Abrir mi carta</button>
    <p class="pie">Hecho con cariño, solo para vos ♡</p>
  </main>
</body>
</html>
